function ext(m){ return m.indexOf("mp4")>=0?"m4a":(m.indexOf("ogg")>=0?"ogg":"webm"); }
function getMic(){
  if(stream) return Promise.resolve(stream);
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:false,channelCount:1}}).then(function(s){
    stream=s; ac=new (window.AudioContext||window.webkitAudioContext)(); an=ac.createAnalyser(); an.fftSize=1024; ac.createMediaStreamSource(s).connect(an); return s; });
}
function level(){
  var a=new Float32Array(an.fftSize); an.getFloatTimeDomainData(a); var p=0; for(var i=0;i<a.length;i++) p=Math.max(p,Math.abs(a[i]));
  $("lvl").style.width=Math.min(100,p*140)+"%";
  var now=performance.now();
  if(recording && $("autoStop").checked){
    if(p>0.06){ heard=true; silentSince=0; }
    else if(heard){ if(!silentSince) silentSince=now; else if(now-silentSince>900) stop(); }
    if(now-startT>12000) stop();
  }
  raf=requestAnimationFrame(level);
}
function start(){
  getMic().then(function(s){
    if(ac.state==="suspended") ac.resume();
    chunks=[]; var item=DECK[idx]; mr=new MediaRecorder(s, MIME?{mimeType:MIME}:undefined);
    mr.ondataavailable=function(e){ if(e.data.size) chunks.push(e.data); };
    var rec=mr; rec.onstop=function(){ var m=rec.mimeType||MIME||"audio/webm";
      put(item.id,{blob:new Blob(chunks,{type:m}),mime:m,lb:item.lb,t:Date.now()}); render();
      if(DECK[idx].id===item.id){ play(); $("st").textContent="Saved. Keep → Next, or R to redo."; } else $("st").textContent="Saved “"+item.lb+"”."; };
    mr.start(); recording=true; heard=false; silentSince=0; startT=performance.now();
    $("rec").classList.add("on"); $("rec").textContent="STOP"; $("st").textContent="Recording… speak now.";
    if(!raf) level();
  }, function(e){ $("st").textContent="Microphone blocked: "+e.message; });
}
function stop(){ if(!recording) return; recording=false; $("rec").classList.remove("on"); $("rec").textContent="REC"; try{ mr.stop(); }catch(_){} }
function toggle(){ recording?stop():start(); }
var au=null;
function play(){ var id=DECK[idx].id, r=fresh(id)?clips[id]:null; if(!r){ if(LIVE[id]!==undefined){ if(au) au.pause(); au=new Audio("../audio/"+id+".mp3"); au.play().catch(function(){}); } return; } if(au){ au.pause(); URL.revokeObjectURL(au.src); } au=new Audio(URL.createObjectURL(r.blob)); au.play().catch(function(){}); }

/* ---- zip (store, no compression) ---- */
var CRC=(function(){ var t=new Uint32Array(256); for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc(u){ var c=0xFFFFFFFF; for(var i=0;i<u.length;i++) c=CRC[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files){ /* files: [{name, data:Uint8Array}] */
  var enc=new TextEncoder(), parts=[], cen=[], off=0;
  files.forEach(function(f){
    var nm=enc.encode(f.name), c=crc(f.data), h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint32(14,c,true); h.setUint32(18,f.data.length,true); h.setUint32(22,f.data.length,true); h.setUint16(12,0x21,true); h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer),nm,f.data);
    var d=new DataView(new ArrayBuffer(46)); d.setUint32(0,0x02014b50,true); d.setUint16(4,20,true); d.setUint16(6,20,true); d.setUint16(8,0x0800,true); d.setUint32(16,c,true); d.setUint32(20,f.data.length,true); d.setUint32(24,f.data.length,true); d.setUint16(14,0x21,true); d.setUint16(28,nm.length,true); d.setUint32(42,off,true);
    cen.push(new Uint8Array(d.buffer),nm); off+=30+nm.length+f.data.length;
  });
  var cs=cen.reduce(function(a,b){return a+b.length;},0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cs,true); e.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[new Uint8Array(e.buffer)]),{type:"application/zip"});
}
function exportZip(){
  var ids=Object.keys(clips).filter(fresh); if(!ids.length){ $("st").textContent="No new clips since the last import — nothing to export."; return; }
  $("st").textContent="Building zip…";
  Promise.all(ids.map(function(id){ return clips[id].blob.arrayBuffer().then(function(b){ return {name:"clips/"+id+"."+ext(clips[id].mime), data:new Uint8Array(b)}; }); })).then(function(files){
    var man={}; ids.forEach(function(id){ man[id]={lb:clips[id].lb, file:"clips/"+id+"."+ext(clips[id].mime), t:clips[id].t}; });
    files.push({name:"manifest.json", data:new TextEncoder().encode(JSON.stringify(man,null,1))});
    var d=new Date(), st=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)+"-"+("0"+d.getHours()).slice(-2)+("0"+d.getMinutes()).slice(-2);
    var a=document.createElement("a"); a.href=URL.createObjectURL(zip(files)); a.download="letzspeak-audio-"+st+".zip"; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },2000);
    $("st").textContent="Exported "+ids.length+" clips. Attach the zip in the chat with Claude.";
  });
}

document.addEventListener("click",function(e){ var t=e.target.closest("button,li[data-i]"); if(!t) return;
  if(t.dataset.i){ if(recording) stop(); go(+t.dataset.i); window.scrollTo({top:0,behavior:"smooth"}); return; }
  var A={rec:toggle, play:play, next:function(){ if(recording) stop(); nextTodo(); }, prev:function(){ if(recording) stop(); go(idx-1); }, del:function(){ del(DECK[idx].id); render(); }, exp:exportZip};
  if(A[t.id]) A[t.id]();
});
document.addEventListener("keydown",function(e){
  if(e.target.tagName==="INPUT") return;
  var k=e.key.toLowerCase();
  if(k==="r"||k===" "){ e.preventDefault(); toggle(); }
  else if(k==="p") play();
  else if(k==="enter"||k==="arrowright"){ e.preventDefault(); if(recording) stop(); nextTodo(); }
  else if(k==="arrowleft"){ if(recording) stop(); go(idx-1); }
});
openDB(function(){ loadAll(function(){ var f=DECK.findIndex(function(c){ return !done(c); }); idx=f<0?0:f; render(); }); });
})();
</script>
