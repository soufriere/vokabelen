<meta name="robots" content="noindex,nofollow">
<style>
.rec-top{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;position:relative}
.item .word{font-size:clamp(1.7rem,8vw,2.4rem)}
.item .gl{color:var(--ink-dim)}
.item .note{min-height:1.2em}
.recbtn{width:96px;height:96px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:1rem;font-weight:800;cursor:pointer;align-self:center;box-shadow:0 0 0 6px var(--red-tint);transition:transform .1s}
.recbtn.on{animation:pulse 1s infinite;background:#a3141c}
@keyframes pulse{50%{box-shadow:0 0 0 14px var(--red-tint)}}
.meter{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;width:0;background:var(--moss);transition:width .05s}
.ctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ctl .btn{align-self:stretch;text-align:center}
.st{font-size:.85rem;color:var(--ink-dim);text-align:center;min-height:1.3em}
.grid{display:flex;flex-direction:column;gap:14px}
.grid h3{margin:0 0 6px;font-family:"Bricolage Grotesque",Georgia,sans-serif;font-size:1rem}
.grid ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.grid li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer;font-size:.92rem}
.grid li:first-child{border-top:0}
.grid li.cur{background:var(--sky-tint)}
.grid li .s{width:22px;text-align:center}
.grid li .lb{font-weight:700;flex:1}
.kbd{font:.75rem ui-monospace,Menlo,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
</style>
<div class="app">
  <header class="rec-top">
    <div class="flag" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>Lëtz Speak · Recorder</h1>
    <p class="sub">For Jim only. Clips are kept in this browser until you export them.</p>
    <div class="bar"><span id="cnt"></span><div class="track"><i id="fill"></i></div><b id="pct"></b></div>
    <div class="row">
      <label class="lbl"><input type="checkbox" id="onlyTodo" checked> skip recorded</label>
      <label class="lbl"><input type="checkbox" id="autoStop" checked> auto-stop on silence</label>
    </div>
  </header>
  <main style="display:flex;flex-direction:column;gap:12px">
    <div class="item" id="item"></div>
    <div class="meter"><i id="lvl"></i></div>
    <button class="recbtn" id="rec" type="button">REC</button>
    <p class="st" id="st">Tap REC (or press <span class="kbd">R</span> / <span class="kbd">Space</span>), say the word, tap again.</p>
    <div class="ctl">
      <button class="btn" id="prev" type="button">← Prev</button>
      <button class="btn" id="play" type="button">▶ Play</button>
      <button class="btn primary" id="next" type="button">Keep → Next</button>
    </div>
    <div class="ctl">
      <button class="btn danger" id="del" type="button">Delete clip</button>
      <button class="btn primary" id="exp" type="button" style="grid-column:span 2">⬇ Export zip for Claude</button>
    </div>
    <p class="st"><span class="kbd">R</span>/<span class="kbd">Space</span> record · <span class="kbd">P</span> play · <span class="kbd">Enter</span>/<span class="kbd">→</span> next · <span class="kbd">←</span> prev</p>
    <div class="grid" id="grid"></div>
  </main>
</div>
<script>
(function(){
"use strict";
var MODULES = __MODULES__;
var DECK = __DECK__;
var LIVE = __AUDIO__;          /* id -> lb text of clips already live in the trainer */
var $=function(i){return document.getElementById(i);};
function esc(s){ return String(s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];}); }

/* ---- IndexedDB: id -> {blob, mime, lb, t} ---- */
var db=null, clips={};
function openDB(cb){ var q=indexedDB.open("letzspeak-rec",1); q.onupgradeneeded=function(){ q.result.createObjectStore("c"); }; q.onsuccess=function(){ db=q.result; cb(); }; q.onerror=function(){ alert("IndexedDB unavailable — use a normal (non-private) window."); }; }
function loadAll(cb){ var tx=db.transaction("c"), s=tx.objectStore("c"), r=s.openCursor(); r.onsuccess=function(){ var c=r.result; if(c){ clips[c.key]=c.value; c.continue(); } else cb(); }; }
function put(id,v){ clips[id]=v; db.transaction("c","readwrite").objectStore("c").put(v,id); }
function del(id){ delete clips[id]; db.transaction("c","readwrite").objectStore("c").delete(id); }

function state(c){ var r=clips[c.id];
  if(r) return r.lb===c.lb ? "rec" : "stale";
  if(LIVE[c.id]!==undefined) return LIVE[c.id]===c.lb ? "live" : "stale";
  return "todo"; }
var ICON={rec:"🟢",live:"✅",stale:"⚠️",todo:"⚪️"};
var idx=0;
function done(c){ var s=state(c); return s==="rec"||s==="live"; }

function render(){
  var c=DECK[idx], s=state(c);
  $("item").innerHTML='<span class="pill l">M'+c.m+' · '+esc(MODULES[c.m][0])+' · '+(idx+1)+'/'+DECK.length+'</span>'+
    '<span class="pill r'+(s==="todo"?" new":(s==="stale"?" b1":" b5"))+'">'+({rec:"recorded",live:"live in trainer",stale:"text changed — re-record",todo:"to record"})[s]+'</span>'+
    '<div style="height:18px"></div><div class="word">'+esc(c.lb)+'</div><div class="gl">'+esc(c.fr)+' · '+esc(c.en)+'</div><div class="note">'+esc(c.note||"")+'</div>';
  var n=DECK.filter(done).length;
  $("cnt").textContent=n+" / "+DECK.length+" recorded"; $("fill").style.width=Math.round(n/DECK.length*100)+"%"; $("pct").textContent=Math.round(n/DECK.length*100)+"%";
  $("play").disabled=!clips[c.id]; $("del").disabled=!clips[c.id];
  var h="", m=0;
  DECK.forEach(function(x,i){ if(x.m!==m){ if(m) h+="</ul></section>"; m=x.m; h+='<section><h3>Module '+m+' · '+esc(MODULES[m][0])+'</h3><ul>'; }
    h+='<li data-i="'+i+'"'+(i===idx?' class="cur"':'')+'><span class="s">'+ICON[state(x)]+'</span><span class="lb">'+esc(x.lb)+'</span></li>'; });
  $("grid").innerHTML=h+"</ul></section>";
}
function go(i){ idx=(i+DECK.length)%DECK.length; $("st").textContent=clips[DECK[idx].id]?"Recorded. P to play, R to redo.":"Tap REC (or R / Space), say it, tap again."; render(); }
function nextTodo(){
  if(!$("onlyTodo").checked){ go(idx+1); return; }
  for(var k=1;k<=DECK.length;k++){ var j=(idx+k)%DECK.length; if(!done(DECK[j])){ go(j); return; } }
  go(idx+1); $("st").textContent="Everything is recorded 🎉 — export the zip.";
}

/* ---- recording ---- */
var stream=null, mr=null, chunks=[], ac=null, an=null, raf=0, recording=false, silentSince=0, heard=false, startT=0;
var MIME=["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg;codecs=opus"].filter(function(t){ return window.MediaRecorder && MediaRecorder.isTypeSupported(t); })[0]||"";
function ext(m){ return m.indexOf("mp4")>=0?"m4a":(m.indexOf("ogg")>=0?"ogg":"webm"); }
function getMic(){
  if(stream) return Promise.resolve(stream);
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:false,channelCount:1}}).then(function(s){
    stream=s; ac=new (window.AudioContext||window.webkitAudioContext)(); an=ac.createAnalyser(); an.fftSize=1024; ac.createMediaStreamSource(s).connect(an); return s; });
}
function level(){
  var a=new Float32Array(an.fftSize); an.getFloatTimeDomainData(a); var p=0; for(var i=0;i<a.length;i++) p=Math.max(p,Math.abs(a[i]));
  $("lvl").style.width=Math.min(100,p*140)+"%";
  var now=performance.now();
  if(recording && $("autoStop").checked){
    if(p>0.06){ heard=true; silentSince=0; }
    else if(heard){ if(!silentSince) silentSince=now; else if(now-silentSince>900) stop(); }
    if(now-startT>12000) stop();
  }
  raf=requestAnimationFrame(level);
}
function start(){
  getMic().then(function(s){
    if(ac.state==="suspended") ac.resume();
    chunks=[]; mr=new MediaRecorder(s, MIME?{mimeType:MIME}:undefined);
    mr.ondataavailable=function(e){ if(e.data.size) chunks.push(e.data); };
    mr.onstop=function(){ var c=DECK[idx], m=mr.mimeType||MIME||"audio/webm";
      put(c.id,{blob:new Blob(chunks,{type:m}),mime:m,lb:c.lb,t:Date.now()}); render(); play(); $("st").textContent="Saved. Keep → Next, or R to redo."; };
    mr.start(); recording=true; heard=false; silentSince=0; startT=performance.now();
    $("rec").classList.add("on"); $("rec").textContent="STOP"; $("st").textContent="Recording… speak now.";
    if(!raf) level();
  }, function(e){ $("st").textContent="Microphone blocked: "+e.message; });
}
function stop(){ if(!recording) return; recording=false; $("rec").classList.remove("on"); $("rec").textContent="REC"; try{ mr.stop(); }catch(_){} }
function toggle(){ recording?stop():start(); }
var au=null;
function play(){ var r=clips[DECK[idx].id]; if(!r) return; if(au){ au.pause(); URL.revokeObjectURL(au.src); } au=new Audio(URL.createObjectURL(r.blob)); au.play().catch(function(){}); }

/* ---- zip (store, no compression) ---- */
var CRC=(function(){ var t=new Uint32Array(256); for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc(u){ var c=0xFFFFFFFF; for(var i=0;i<u.length;i++) c=CRC[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files){ /* files: [{name, data:Uint8Array}] */
  var enc=new TextEncoder(), parts=[], cen=[], off=0;
  files.forEach(function(f){
    var nm=enc.encode(f.name), c=crc(f.data), h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint32(14,c,true); h.setUint32(18,f.data.length,true); h.setUint32(22,f.data.length,true); h.setUint16(12,0x21,true); h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer),nm,f.data);
    var d=new DataView(new ArrayBuffer(46)); d.setUint32(0,0x02014b50,true); d.setUint16(4,20,true); d.setUint16(6,20,true); d.setUint16(8,0x0800,true); d.setUint32(16,c,true); d.setUint32(20,f.data.length,true); d.setUint32(24,f.data.length,true); d.setUint16(14,0x21,true); d.setUint16(28,nm.length,true); d.setUint32(42,off,true);
    cen.push(new Uint8Array(d.buffer),nm); off+=30+nm.length+f.data.length;
  });
  var cs=cen.reduce(function(a,b){return a+b.length;},0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cs,true); e.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[new Uint8Array(e.buffer)]),{type:"application/zip"});
}
function exportZip(){
  var ids=Object.keys(clips); if(!ids.length){ $("st").textContent="Nothing recorded yet."; return; }
  $("st").textContent="Building zip…";
  Promise.all(ids.map(function(id){ return clips[id].blob.arrayBuffer().then(function(b){ return {name:"clips/"+id+"."+ext(clips[id].mime), data:new Uint8Array(b)}; }); })).then(function(files){
    var man={}; ids.forEach(function(id){ man[id]={lb:clips[id].lb, file:"clips/"+id+"."+ext(clips[id].mime), t:clips[id].t}; });
    files.push({name:"manifest.json", data:new TextEncoder().encode(JSON.stringify(man,null,1))});
    var d=new Date(), st=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)+"-"+("0"+d.getHours()).slice(-2)+("0"+d.getMinutes()).slice(-2);
    var a=document.createElement("a"); a.href=URL.createObjectURL(zip(files)); a.download="letzspeak-audio-"+st+".zip"; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },2000);
    $("st").textContent="Exported "+ids.length+" clips. Attach the zip in the chat with Claude.";
  });
}

document.addEventListener("click",function(e){ var t=e.target.closest("button,li[data-i]"); if(!t) return;
  if(t.dataset.i){ if(recording) stop(); go(+t.dataset.i); window.scrollTo({top:0,behavior:"smooth"}); return; }
  var A={rec:toggle, play:play, next:function(){ if(recording) stop(); nextTodo(); }, prev:function(){ if(recording) stop(); go(idx-1); }, del:function(){ del(DECK[idx].id); render(); }, exp:exportZip};
  if(A[t.id]) A[t.id]();
});
document.addEventListener("keydown",function(e){
  if(e.target.tagName==="INPUT") return;
  var k=e.key.toLowerCase();
  if(k==="r"||k===" "){ e.preventDefault(); toggle(); }
  else if(k==="p") play();
  else if(k==="enter"||k==="arrowright"){ e.preventDefault(); if(recording) stop(); nextTodo(); }
  else if(k==="arrowleft"){ if(recording) stop(); go(idx-1); }
});
openDB(function(){ loadAll(function(){ var f=DECK.findIndex(function(c){ return !done(c); }); idx=f<0?0:f; render(); }); });
})();
</script>
