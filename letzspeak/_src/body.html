<style>
.langsw{display:inline-flex;align-items:center;gap:6px}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--amber-tint);border:1.5px solid var(--amber);border-radius:14px;padding:10px 13px;font-size:.86rem;line-height:1.4}
.warn b:first-child{display:block;font-size:.9rem;letter-spacing:.01em}
.warn .ico{font-size:1.2rem;line-height:1}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.prog .now{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prog .now b{font-family:"Bricolage Grotesque",Georgia,sans-serif;font-size:1rem}
.prog .now span{font-size:.8rem;color:var(--ink-dim);white-space:nowrap}
.mods{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:5px}
.mod{position:relative;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;height:44px;cursor:pointer;padding:0;overflow:hidden;font-weight:800;font-size:.85rem;color:var(--ink-dim)}
.mod i{position:absolute;left:0;bottom:0;height:100%;background:var(--moss-tint);z-index:0}
.mod span{position:relative;z-index:1}
.mod.done{background:var(--moss);border-color:var(--moss);color:#fff}
.mod.done i{display:none}
.mod.cur{border-color:var(--sky);box-shadow:0 0 0 2px var(--sky-tint)}
.mod.sel{outline:2.5px solid var(--ink);outline-offset:1px}
.mod.locked{opacity:.55;background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface) 6px 12px)}
.mod.rev{font-size:.72rem}
.mod.rev.has{border-color:var(--red);color:var(--red)}
.modtitle{display:flex;flex-direction:column;gap:2px}
.modtitle h2{margin:0;font-family:"Bricolage Grotesque",Georgia,sans-serif;font-size:1.25rem;line-height:1.15}
.modtitle p{margin:0;color:var(--ink-dim);font-size:.88rem}
.done-box{background:var(--moss-tint);border:1.5px solid var(--moss);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.92rem}
.pick{display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.pick .btn{align-self:stretch;padding:14px;font-size:1rem}
.spk{border:1.5px solid var(--sky);background:var(--surface);color:var(--sky);border-radius:999px;width:46px;height:46px;font-size:1.25rem;cursor:pointer;align-self:center;line-height:1;padding:0}
.spk.sm{width:30px;height:30px;font-size:.85rem;border-width:1px}
.list li{grid-template-columns:12px 1fr 1fr 30px}
.sndt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.82rem;color:var(--ink-dim);cursor:pointer}
.sndt.on{background:var(--sky-tint);border-color:var(--sky);color:var(--sky)}
</style>

<div class="app">
  <header>
    <div class="top">
      <div>
        <div class="flag" aria-hidden="true"><i></i><i></i><i></i></div>
        <h1>Lëtz Speak Vocab</h1>
        <p class="sub" id="deckInfo"></p>
      </div>
      <div class="seg" role="group" id="langSeg" aria-label="Langue / Language">
        <button data-lang="fr" type="button">FR</button>
        <button data-lang="en" type="button">EN</button>
      </div>
    </div>
    <div class="warn" role="note"><span class="ico" aria-hidden="true">⚠️</span><span data-i18n-html="warnStorage"></span></div>
    <div class="prog" id="prog"></div>
    <div class="row">
      <div class="seg" role="group" data-i18n-aria="ariaMode">
        <button id="mCards" class="on" type="button" data-i18n="modeCards"></button>
        <button id="mQuiz" type="button" data-i18n="modeQuiz"></button>
        <button id="mList" type="button" data-i18n="modeList"></button>
      </div>
      <div class="seg" id="dirSeg" role="group" data-i18n-aria="ariaSens">
        <button data-d="fl" type="button"></button>
        <button data-d="lf" type="button"></button>
        <button data-d="mix" type="button" data-i18n="dirMix"></button>
      </div>
      <button class="sndt" id="sndBtn" type="button" hidden></button>
    </div>
    <div class="stats">
      <div class="stat"><b id="sNew">0</b><span data-i18n="statNew"></span></div>
      <div class="stat due"><b id="sDue">0</b><span data-i18n="statDue"></span></div>
      <div class="stat lrn"><b id="sLrn">0</b><span data-i18n="statLrn"></span></div>
      <div class="stat known"><b id="sKnown">0</b><span data-i18n="statKnown"></span></div>
    </div>
  </header>
  <div id="banners"></div>
  <main id="main"></main>
  <footer>
    <span id="streak"></span>
    <span><button class="link" id="helpBtn" type="button" data-i18n="helpBtn"></button> · <button class="link" id="saveBtn" type="button" data-i18n="saveBtn"></button></span>
  </footer>
</div>

<div class="sheet" id="langSheet" hidden>

function load(){ try{ var r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function idb(cb){ try{ var q=indexedDB.open("letzspeak-vocab",1); q.onupgradeneeded=function(){ q.result.createObjectStore("s"); }; q.onsuccess=function(){ cb(q.result); }; q.onerror=function(){}; }catch(e){} }
function idbPut(o){ idb(function(db){ try{ db.transaction("s","readwrite").objectStore("s").put(o,"state"); }catch(e){} }); }
function idbGet(cb){ var done=false; setTimeout(function(){ if(!done){done=true;cb(null);} },1500);
  idb(function(db){ try{ var r=db.transaction("s").objectStore("s").get("state"); r.onsuccess=function(){ if(!done){done=true;cb(r.result||null);} }; r.onerror=function(){ if(!done){done=true;cb(null);} }; }catch(e){ if(!done){done=true;cb(null);} } }); }

function save(){ S.savedAt = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} if(idbReady) idbPut(JSON.parse(JSON.stringify(S))); }

/* NEVER wipe saved progress on upgrade: keep every stored field, only fill in fields that newer versions added */
function upgrade(o){ var d=blank(); if(!o || typeof o!=="object") return d; for(var k in d) if(o[k]===undefined) o[k]=d[k]; if(!o.p || typeof o.p!=="object") o.p={}; o.v=1; return o; }
S = upgrade(S);

  if(S.mod!=="rev"){ S.mod = +S.mod||1; if(S.mod>S.unlocked) S.mod=S.unlocked; }

  if(S.snd===undefined) S.snd = true;
}
norm();
var byId = {}; DECK.forEach(function(c){ byId[c.id]=c; });
var knownSet = {}; (S.known||[]).forEach(function(id){ knownSet[id]=1; });
var added = fresh ? [] : DECK.filter(function(c){ return !knownSet[c.id] && c.m<=S.unlocked; });
S.known = Object.keys(Object.assign(knownSet, byId));
var T = UI[S.lang||"fr"];
var flash = 0;   // one-off banner (module unlocked)
save();

function today(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function st(id,d){ var p=S.p[id]; return (p && p[d]) || null; }
function setSt(id,d,v){ S.p[id]=S.p[id]||{}; S.p[id][d]=v; }
function dirsFor(){ return S.dir==="mix" ? ["fl","lf"] : [S.dir]; }
function best(c){ var a=st(c.id,"fl"), b=st(c.id,"lf"); return Math.max(a?a.b:-1, b?b.b:-1); }
function learnt(c){ return best(c)>=2; }
function modItems(m){ return DECK.filter(function(c){ return c.m===m; }); }
function modStats(m){ var it=modItems(m), l=it.filter(learnt).length; return {n:it.length, l:l, done: it.length>0 && l===it.length}; }
function doneCount(){ return MODNUMS.filter(function(m){ return modStats(m).done; }).length; }
/* the module the student is "on": first unlocked module that isn't complete */
function curMod(){ for(var i=0;i<MODNUMS.length;i++){ var m=MODNUMS[i]; if(m>S.unlocked) break; if(!modStats(m).done) return m; } return S.unlocked; }
function checkUnlock(){
  var cm = curMod();
  while(S.unlocked<NMOD && modStats(S.unlocked).done){ S.unlocked++; flash = S.unlocked; }
  return cm;
}
function dueRev(){ var now=Date.now(), n=0; DECK.forEach(function(c){ if(c.m>S.unlocked) return; ["fl","lf"].forEach(function(d){ var x=st(c.id,d); if(x && x.due<=now) n++; }); }); return n; }

function inPool(c){ return S.mod==="rev" ? c.m<=S.unlocked : c.m===S.mod; }
function pool(){ return DECK.filter(inPool); }
function counts(){
  var now=Date.now(), n=0,due=0,lrn=0,kn=0,total=0, ds=dirsFor();
  pool().forEach(function(c){ ds.forEach(function(d){ var x=st(c.id,d); total++;
    if(!x) n++; else { if(x.due<=now) due++; if(x.b>=4) kn++; else lrn++; } }); });
  return {n:n,due:due,lrn:lrn,kn:kn,total:total};
}
function newLeft(){ if(S.newToday.d!==today()) S.newToday={d:today(),n:0}; return Math.max(0, NEW_PER_DAY-S.newToday.n); }

var recent = [];
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function pick(){
  var now=Date.now(), ds=dirsFor(), dueL=[], newL=[], unl=[];
  pool().forEach(function(c){ ds.forEach(function(d){
    var x=st(c.id,d), k=c.id+"|"+d; if(recent.indexOf(k)!==-1) return;
    if(!x) newL.push({c:c,d:d});
    else if(x.due<=now) dueL.push({c:c,d:d});
    else if(S.mod!=="rev" && !learnt(c)) unl.push({c:c,d:d,due:x.due});
  }); });
  if(dueL.length) return rnd(dueL);
  if(S.mod!=="rev" && newL.length && newLeft()>0){
    if(S.dir==="mix"){ var pref=newL.filter(function(x){ return x.d==="lf" || st(x.c.id,"lf"); }); if(pref.length) newL=pref; }
    return rnd(newL);
  }
  /* inside a module: words not yet learnt come back right away so the module can be finished in one sitting */
  if(unl.length){ unl.sort(function(a,b){return a.due-b.due;}); return unl[0]; }
  return null;
}
function rate(item,g){
  var x=st(item.c.id,item.d), wasNew=!x, now=Date.now();
  x = x || {b:0,due:0,ok:0,ko:0};
  if(g===0){ x.b=1; x.due=now+60e3; x.ko++; }
  else if(g===1){ x.b=Math.max(1,x.b); x.due=now+(x.b>=2?Math.max(0.5,IV[x.b]*0.5)*DAY:3*60e3); x.ok++; }
  else { x.b=Math.min(6,Math.max(2,x.b+1)); x.due=now+IV[x.b]*DAY; x.ok++; }
  x.t=now; setSt(item.c.id,item.d,x);
  if(wasNew){ newLeft(); S.newToday.n++; }
  S.bk.n++;
  var t=today();
  if(S.streak.d!==t){ var y=new Date(Date.now()-DAY), yd=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate(); S.streak={d:t, n:S.streak.d===yd?S.streak.n+1:1}; }
  recent.push(item.c.id+"|"+item.d); if(recent.length>3) recent.shift();
  checkUnlock(); save();
}

function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function renderQuiz(){
  cur=pick(); answered=false;
  if(!cur){ $("main").innerHTML = doneBox()+empty(); return; }
  var c=cur.c, d=cur.d, ans=sideText(c,d,false);
  var same=DECK.filter(function(o){ return o.id!==c.id && o.m===c.m && sideText(o,d,false)!==ans; });
  var other=DECK.filter(function(o){ return o.id!==c.id && o.m!==c.m && o.m<=S.unlocked && sideText(o,d,false)!==ans; });
  var picks=shuffle(same).slice(0,3); if(picks.length<3) picks=picks.concat(shuffle(other).slice(0,3-picks.length));
  var seen={}; seen[ans]=1; var opts=[ans];
  picks.forEach(function(o){ var t=sideText(o,d,false); if(!seen[t]){ seen[t]=1; opts.push(t); } });
  shuffle(opts);
  $("main").innerHTML = doneBox()+
    '<div class="prompt"><span class="pill l">'+esc(tag(c))+'</span>'+boxPill(st(c.id,d))+
      '<div class="lang" style="margin-top:18px">'+esc(sideLang(d,true))+'</div><div class="word">'+esc(sideText(c,d,true))+'</div>'+(d==="lf"?spk(c.id):'')+'</div>'+

function openSave(){
  $("exportBox").value=makeCode(); $("importBox").value=""; $("saveStatus").textContent="";
  $("resetConfirm").hidden=true; $("resetBtn").hidden=false;
  $("bkInfo").textContent = S.bk.t ? T.lastBackupAgo(ago(S.bk.t)) : T.noBackupYet;
  $("saveSheet").hidden=false;
}
function doImport(txt){
  var raw=(typeof txt==="string"?txt:$("importBox").value).trim();
  try{
    if(raw.indexOf(CODE)!==0) throw 0;
    var d=JSON.parse(decodeURIComponent(escape(atob(raw.slice(CODE.length)))));
    if(!d || typeof d.p!=="object") throw 0;
    Object.keys(d.p).forEach(function(id){ Object.keys(d.p[id]).forEach(function(dir){ var a=st(id,dir), b=d.p[id][dir]; if(!a || (b.t||0)>(a.t||0)) setSt(id,dir,b); }); });
    if(d.streak && d.streak.n>S.streak.n) S.streak=d.streak;
    if(d.unlocked) S.unlocked=Math.max(S.unlocked, +d.unlocked);
    if(d.at) S.bk={t:Math.max(S.bk.t||0,d.at), n:0};
    norm(); checkUnlock(); S.mod=S.unlocked;
    $("bkInfo").textContent = S.bk.t ? T.lastBackupAgo(ago(S.bk.t)) : "";
    save(); $("saveStatus").textContent=T.restoreSuccess; banners(); render();
  }catch(_){ $("saveStatus").textContent=T.restoreError(CODE); }
}
$("bkFile").addEventListener("change", function(){
  var f=this.files && this.files[0]; if(!f) return;
  var r=new FileReader(); r.onload=function(){ doImport(String(r.result)); }; r.onerror=function(){ $("saveStatus").textContent=T.fileReadError; };
  r.readAsText(f); this.value="";
});

checkUnlock(); flash=0; save();
applyI18n(); banners(); render();

else if(fresh && !seenHelp) $("helpSheet").hidden=false;

}); }
})();
