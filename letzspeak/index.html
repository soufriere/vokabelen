function save(){ S.savedAt = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} if(idbReady) idbPut(JSON.parse(JSON.stringify(S))); }
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

var S = load();
var fresh = !S;
function blank(){ return {v:1, snd:true, p:{}, known:[], lang:null, dir:"lf", mod:1, unlocked:1, mode:"cards", streak:{d:"",n:0}, newToday:{d:"",n:0}, bk:{t:0,n:0}}; }
/* NEVER wipe saved progress on upgrade: keep every stored field, only fill in fields that newer versions added */
function upgrade(o){ var d=blank(); if(!o || typeof o!=="object") return d; for(var k in d) if(o[k]===undefined) o[k]=d[k]; if(!o.p || typeof o.p!=="object") o.p={}; o.v=1; return o; }
S = upgrade(S);
function norm(){
  S.p = S.p || {}; S.bk = S.bk || {t:0,n:0}; S.unlocked = Math.min(NMOD, Math.max(1, +S.unlocked||1));
  if(S.mod!=="rev"){ S.mod = +S.mod||1; if(S.mod>S.unlocked) S.mod=S.unlocked; }
  if(S.lang!=="fr" && S.lang!=="en") S.lang = null;
  if(S.snd===undefined) S.snd = true;
}
norm();
var byId = {}; DECK.forEach(function(c){ byId[c.id]=c; });
var knownSet = {}; (S.known||[]).forEach(function(id){ knownSet[id]=1; });
var added = fresh ? [] : DECK.filter(function(c){ return !knownSet[c.id] && c.m<=S.unlocked; });
S.known = Object.keys(Object.assign(knownSet, byId));
var T = UI[S.lang||"fr"];
var flash = 0;   // one-off banner (module unlocked)
save();

function today(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function st(id,d){ var p=S.p[id]; return (p && p[d]) || null; }
function setSt(id,d,v){ S.p[id]=S.p[id]||{}; S.p[id][d]=v; }
function dirsFor(){ return S.dir==="mix" ? ["fl","lf"] : [S.dir]; }
function best(c){ var a=st(c.id,"fl"), b=st(c.id,"lf"); return Math.max(a?a.b:-1, b?b.b:-1); }
function learnt(c){ return best(c)>=2; }
function modItems(m){ return DECK.filter(function(c){ return c.m===m; }); }
function modStats(m){ var it=modItems(m), l=it.filter(learnt).length; return {n:it.length, l:l, done: it.length>0 && l===it.length}; }
function doneCount(){ return MODNUMS.filter(function(m){ return modStats(m).done; }).length; }
/* the module the student is "on": first unlocked module that isn't complete */
function curMod(){ for(var i=0;i<MODNUMS.length;i++){ var m=MODNUMS[i]; if(m>S.unlocked) break; if(!modStats(m).done) return m; } return S.unlocked; }
function checkUnlock(){
  var cm = curMod();
  while(S.unlocked<NMOD && modStats(S.unlocked).done){ S.unlocked++; flash = S.unlocked; }
  return cm;
}
function dueRev(){ var now=Date.now(), n=0; DECK.forEach(function(c){ if(c.m>S.unlocked) return; ["fl","lf"].forEach(function(d){ var x=st(c.id,d); if(x && x.due<=now) n++; }); }); return n; }

function inPool(c){ return S.mod==="rev" ? c.m<=S.unlocked : c.m===S.mod; }
function pool(){ return DECK.filter(inPool); }
function counts(){
  var now=Date.now(), n=0,due=0,lrn=0,kn=0,total=0, ds=dirsFor();
  pool().forEach(function(c){ ds.forEach(function(d){ var x=st(c.id,d); total++;
    if(!x) n++; else { if(x.due<=now) due++; if(x.b>=4) kn++; else lrn++; } }); });
  return {n:n,due:due,lrn:lrn,kn:kn,total:total};
}
function newLeft(){ if(S.newToday.d!==today()) S.newToday={d:today(),n:0}; return Math.max(0, NEW_PER_DAY-S.newToday.n); }

var recent = [];
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function pick(){
  var now=Date.now(), ds=dirsFor(), dueL=[], newL=[], unl=[];
  pool().forEach(function(c){ ds.forEach(function(d){
    var x=st(c.id,d), k=c.id+"|"+d; if(recent.indexOf(k)!==-1) return;
    if(!x) newL.push({c:c,d:d});
    else if(x.due<=now) dueL.push({c:c,d:d});
    else if(S.mod!=="rev" && !learnt(c)) unl.push({c:c,d:d,due:x.due});
  }); });
  if(dueL.length) return rnd(dueL);
  if(S.mod!=="rev" && newL.length && newLeft()>0){
    if(S.dir==="mix"){ var pref=newL.filter(function(x){ return x.d==="lf" || st(x.c.id,"lf"); }); if(pref.length) newL=pref; }
    return rnd(newL);
  }
  /* inside a module: words not yet learnt come back right away so the module can be finished in one sitting */
  if(unl.length){ unl.sort(function(a,b){return a.due-b.due;}); return unl[0]; }
  return null;
}
function rate(item,g){
  var x=st(item.c.id,item.d), wasNew=!x, now=Date.now();
  x = x || {b:0,due:0,ok:0,ko:0};
  if(g===0){ x.b=1; x.due=now+60e3; x.ko++; }
  else if(g===1){ x.b=Math.max(1,x.b); x.due=now+(x.b>=2?Math.max(0.5,IV[x.b]*0.5)*DAY:3*60e3); x.ok++; }
  else { x.b=Math.min(6,Math.max(2,x.b+1)); x.due=now+IV[x.b]*DAY; x.ok++; }
  x.t=now; setSt(item.c.id,item.d,x);
  if(wasNew){ newLeft(); S.newToday.n++; }
  S.bk.n++;
  var t=today();
  if(S.streak.d!==t){ var y=new Date(Date.now()-DAY), yd=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate(); S.streak={d:t, n:S.streak.d===yd?S.streak.n+1:1}; }
  recent.push(item.c.id+"|"+item.d); if(recent.length>3) recent.shift();
  checkUnlock(); save();
}

var $ = function(id){ return document.getElementById(id); };

function header(){

  });
  h += '<button class="mod rev'+(rv?" has":"")+(S.mod==="rev"?" sel":"")+'" type="button" data-mod="rev" title="'+esc(T.review)+'"><span>↻'+(rv?'<br>'+rv:'')+'</span></button>';
  h += '</div>';
  if(S.mod==="rev") h += '<div class="modtitle"><h2>'+esc(T.reviewTitle)+'</h2><p>'+esc(T.reviewSub)+'</p></div>';

    h += '<div class="modtitle"><h2>Module '+S.mod+' · '+esc(MODULES[S.mod][0])+'</h2><p>'+esc(modLabel(S.mod))+'</p></div>';

  Array.prototype.forEach.call($("dirSeg").children, function(b){ b.classList.toggle("on", b.dataset.d===S.dir); });
  ["Cards","Quiz","List"].forEach(function(m){ $("m"+m).classList.toggle("on", S.mode===m.toLowerCase()); });
  $("dirSeg").hidden = S.mode==="list";
  $("sndBtn").hidden = !HAS_AUDIO || S.mode==="list"; $("sndBtn").textContent = S.snd?T.sndOn:T.sndOff; $("sndBtn").classList.toggle("on", !!S.snd);
  $("streak").textContent = S.streak.n>1 && S.streak.d===today() ? T.streakN(S.streak.n) : (S.streak.d===today() ? T.streakToday : T.streakNone);
}

function banners(){
  var h="";
  if(flash) h += '<div class="banner" id="bFlash"><span>'+T.bannerUnlocked(flash)+'</span><button type="button" data-dismiss="bFlash" aria-label="'+T.ariaClose+'">✕</button></div>';
  if(added.length) h += '<div class="banner" id="bNew"><span>'+T.bannerAdded(added.length)+'</span><button type="button" data-dismiss="bNew" aria-label="'+T.ariaClose+'">✕</button></div>';
  if(needBackup()) h += '<div class="banner warm" id="bBk"><span>'+T.bannerBackup+'</span><button type="button" class="btn primary" id="bkBanner" style="margin-left:auto;padding:6px 12px;font-size:.82rem;color:#fff">'+T.bannerBackupBtn+'</button></div>';
  if(recovered) h += '<div class="banner" id="bRec"><span>'+T.bannerRecovered+'</span><button type="button" data-dismiss="bRec" aria-label="'+T.ariaClose+'">✕</button></div>';
  $("banners").innerHTML = h;
}
function reviewed(){ return Object.keys(S.p).length>0; }
function needBackup(){ return reviewed() && S.bk.n>=40 && (Date.now()-(S.bk.t||0))>3*DAY; }
var recovered=false;
var cur=null, flipped=false, answered=false;

function doneBox(){
  if(S.mod==="rev" || !modStats(S.mod).done) return "";
  var nx = S.mod<NMOD ? '<button class="btn primary" type="button" data-mod="'+(S.mod+1)+'">'+esc(T.doneNext(S.mod+1))+'</button>' : '';
  return '<div class="done-box"><b>'+esc(T.doneBox(S.mod))+'</b>'+nx+'</div>';
}
function empty(){
  var k=counts(), msg;
  if(S.mod!=="rev" && modStats(S.mod).done) msg=T.emptyModuleDone;
  else if(k.n>0 && newLeft()===0 && S.mod!=="rev") msg=T.emptyNewCap(NEW_PER_DAY);
  else if(k.total===0) msg=T.emptyNoSelection;
  else msg=T.emptyNothingDue;
  var more=(S.mod!=="rev" && k.n>0 && newLeft()===0) ? '<button class="next" id="moreNew" type="button">'+T.emptyMoreBtn+'</button>' : '';

function nextLabel(x){ var b=x?Math.min(6,Math.max(2,x.b+1)):2, d=IV[b]; return d===1?T.next1Day:(d<7?T.nextDays(d):(d<30?T.nextWeeks(Math.round(d/7)):T.nextMonth)); }

function renderCards(){
  cur=pick(); flipped=false;
  if(!cur){ $("main").innerHTML = doneBox()+empty(); return; }
  var c=cur.c, d=cur.d, x=st(c.id,d);
  var note = c.note ? '<div class="note">'+esc(c.note)+'</div>' : '';

    '<div class="card" id="card" role="button" tabindex="0" aria-label="'+T.ariaFlip+'"><div class="inner">'+

        '<div class="cue">'+esc(d==="fl"?T.cueSpeak:T.cueMeaning)+'</div></div>'+

        '<div class="lang">'+esc(sideLang(d,false))+'</div><div class="word">'+esc(sideText(c,d,false))+'</div>'+(d==="fl"?spk(c.id):'')+note+
        '<div class="echo">'+esc(sideText(c,d,true))+'</div>'+(d==="fl"?'<div class="cue">'+esc(T.cueRepeat)+'</div>':'')+'</div>'+
    '</div></div>'+

      '<button class="a" data-g="0" type="button">'+esc(T.rateAgain)+'<small>'+esc(T.rateAgainSmall)+'</small></button>'+
      '<button class="h" data-g="1" type="button">'+esc(T.ratePresque)+'<small>'+esc(T.ratePresqueSmall)+'</small></button>'+
      '<button class="g" data-g="2" type="button">'+esc(T.rateGood)+'<small>'+esc(nextLabel(x))+'</small></button>'+
    '</div>';
  if(d==="lf") autoSay(c.id);
}
function flip(){ if(!cur||flipped) return; flipped=true; $("card").classList.add("flip"); $("reveal").hidden=true; $("rate").classList.remove("off"); if(cur.d==="fl") autoSay(cur.c.id); }

function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function renderQuiz(){
  cur=pick(); answered=false;
  if(!cur){ $("main").innerHTML = doneBox()+empty(); return; }
  var c=cur.c, d=cur.d, ans=sideText(c,d,false);
  var same=DECK.filter(function(o){ return o.id!==c.id && o.m===c.m && sideText(o,d,false)!==ans; });
  var other=DECK.filter(function(o){ return o.id!==c.id && o.m!==c.m && o.m<=S.unlocked && sideText(o,d,false)!==ans; });
  var picks=shuffle(same).slice(0,3); if(picks.length<3) picks=picks.concat(shuffle(other).slice(0,3-picks.length));
  var seen={}; seen[ans]=1; var opts=[ans];
  picks.forEach(function(o){ var t=sideText(o,d,false); if(!seen[t]){ seen[t]=1; opts.push(t); } });
  shuffle(opts);
  $("main").innerHTML = doneBox()+
    '<div class="prompt"><span class="pill l">'+esc(tag(c))+'</span>'+boxPill(st(c.id,d))+
      '<div class="lang" style="margin-top:18px">'+esc(sideLang(d,true))+'</div><div class="word">'+esc(sideText(c,d,true))+'</div>'+(d==="lf"?spk(c.id):'')+'</div>'+
    '<div class="opts" id="opts">'+opts.map(function(o){ return '<button class="opt" type="button" data-v="'+esc(o)+'">'+esc(o)+'</button>'; }).join("")+'</div>';
  $("main").dataset.ans=ans;
  if(d==="lf") autoSay(c.id);
}
function answer(btn){

  rate(cur, ok?2:0); header(); banners();
  var nx=document.createElement("button"); nx.className="next"; nx.type="button"; nx.id="nextQ"; nx.textContent= ok?T.quizCorrect:T.quizWrong;
  $("main").appendChild(nx); nx.focus();

    h+='</ul></section>';

function render(){ header(); if(S.mode==="quiz") renderQuiz(); else if(S.mode==="list") renderList(); else renderCards(); }

function setLang(l){ S.lang=l; T=UI[l]; save(); applyI18n(); banners(); render(); }
function selectMod(v){
  if(v==="rev"){ S.mod="rev"; recent=[]; save(); render(); return; }

    $("lockTitle").textContent=T.lockTitle(m); $("lockText").textContent=T.lockText(m, S.unlocked);

document.addEventListener("click", function(e){

  if(t.dataset.lang){ setLang(t.dataset.lang); return; }
  if(t.dataset.mod){ selectMod(t.dataset.mod); return; }
  if(t.id==="lockGo"){ var m=+t.dataset.m; S.unlocked=Math.max(S.unlocked,m); S.mod=m; flash=m; $("lockSheet").hidden=true; save(); banners(); render(); return; }
  if(t.dataset.g!==undefined && cur){ rate(cur,+t.dataset.g); banners(); render(); return; }
  if(t.classList.contains("opt")){ answer(t); return; }
  if(t.id==="nextQ"){ render(); return; }
  if(t.id==="moreNew"){ S.newToday.n=Math.max(0,S.newToday.n-5); save(); render(); return; }
  if(t.dataset.d){ S.dir=t.dataset.d; recent=[]; save(); render(); return; }
  if(t.id==="mCards"||t.id==="mQuiz"||t.id==="mList"){ S.mode=t.id.slice(1).toLowerCase(); save(); render(); return; }
  if(t.dataset.dismiss){ var b=$(t.dataset.dismiss); if(b) b.remove(); if(t.dataset.dismiss==="bFlash") flash=0; if(t.dataset.dismiss==="bNew") added=[]; if(t.dataset.dismiss==="bRec") recovered=false; return; }
  if(t.id==="helpBtn"){ $("helpSheet").hidden=false; return; }
  if(t.id==="saveBtn"){ openSave(); return; }
  if(t.hasAttribute("data-close")){ t.closest(".sheet").hidden=true; try{localStorage.setItem(KEY+"-help","1");}catch(_){} render(); return; }
  if(t.id==="copyBtn"){ var v=$("exportBox").value, ok=function(){ $("saveStatus").textContent=T.copyOk; };
    try{ navigator.clipboard.writeText(v).then(ok,function(){ $("exportBox").select(); $("saveStatus").textContent=T.copyFallback; }); }catch(_){ $("exportBox").select(); $("saveStatus").textContent=T.copyFallback; } return; }
  if(t.id==="importBtn"){ doImport(); return; }
  if(t.id==="bkBtn"||t.id==="bkBanner"){ doBackup(); return; }
  if(t.id==="resetBtn"){ t.hidden=true; $("resetConfirm").hidden=false; return; }
  if(t.id==="resetConfirm"){ var l=S.lang; S=blank(); S.lang=l; S.known=Object.keys(byId); save(); $("saveStatus").textContent=T.resetDone; t.hidden=true; $("resetBtn").hidden=false; banners(); render(); return; }
});
document.addEventListener("keydown", function(e){
  if(document.querySelector(".sheet:not([hidden])")) return;
  if(S.mode!=="cards"||!cur) return;
  if((e.key===" "||e.key==="Enter") && !flipped){ e.preventDefault(); flip(); }

});
document.querySelectorAll(".sheet").forEach(function(s){ s.addEventListener("click", function(e){ if(e.target===s && s.id!=="langSheet"){ s.hidden=true; render(); } }); });

function makeCode(){ return CODE+btoa(unescape(encodeURIComponent(JSON.stringify({v:1,p:S.p,streak:S.streak,known:S.known,unlocked:S.unlocked,lang:S.lang,at:Date.now()})))); }
function ago(t){ var d=Math.floor((Date.now()-t)/DAY); return d<=0?T.agoToday:(d===1?T.agoYesterday:T.agoDays(d)); }
function stamp(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function backupDone(){ S.bk={t:Date.now(),n:0}; save(); banners(); if(!$("saveSheet").hidden) $("bkInfo").textContent=T.lastBackupToday; }
function doBackup(){
  var code=makeCode(), name="letzspeak-"+T.backupFileWord+"-"+stamp()+".txt";
  try{
    var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([code],{type:"text/plain"})); a.download=name;
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
    backupDone(); if($("saveSheet").hidden) openSave(); $("saveStatus").textContent=T.backupFallback;
  }catch(_){ if($("saveSheet").hidden) openSave(); $("saveStatus").textContent=T.backupFallbackErr; }
}
function openSave(){
  $("exportBox").value=makeCode(); $("importBox").value=""; $("saveStatus").textContent="";
  $("resetConfirm").hidden=true; $("resetBtn").hidden=false;
  $("bkInfo").textContent = S.bk.t ? T.lastBackupAgo(ago(S.bk.t)) : T.noBackupYet;
  $("saveSheet").hidden=false;
}
function doImport(txt){
  var raw=(typeof txt==="string"?txt:$("importBox").value).trim();
  try{
    if(raw.indexOf(CODE)!==0) throw 0;
    var d=JSON.parse(decodeURIComponent(escape(atob(raw.slice(CODE.length)))));
    if(!d || typeof d.p!=="object") throw 0;
    Object.keys(d.p).forEach(function(id){ Object.keys(d.p[id]).forEach(function(dir){ var a=st(id,dir), b=d.p[id][dir]; if(!a || (b.t||0)>(a.t||0)) setSt(id,dir,b); }); });
    if(d.streak && d.streak.n>S.streak.n) S.streak=d.streak;
    if(d.unlocked) S.unlocked=Math.max(S.unlocked, +d.unlocked);
    if(d.at) S.bk={t:Math.max(S.bk.t||0,d.at), n:0};
    norm(); checkUnlock(); S.mod=S.unlocked;
    $("bkInfo").textContent = S.bk.t ? T.lastBackupAgo(ago(S.bk.t)) : "";
    save(); $("saveStatus").textContent=T.restoreSuccess; banners(); render();
  }catch(_){ $("saveStatus").textContent=T.restoreError(CODE); }
}
$("bkFile").addEventListener("change", function(){
  var f=this.files && this.files[0]; if(!f) return;
  var r=new FileReader(); r.onload=function(){ doImport(String(r.result)); }; r.onerror=function(){ $("saveStatus").textContent=T.fileReadError; };
  r.readAsText(f); this.value="";
});

var seenHelp=false; try{ seenHelp=localStorage.getItem(KEY+"-help")==="1"; }catch(_){}
checkUnlock(); flash=0; save();
applyI18n(); banners(); render();
if(!S.lang) $("langSheet").hidden=false;
else if(fresh && !seenHelp) $("helpSheet").hidden=false;
if(fresh){ idbGet(function(o){
  idbReady=true;
  if(!(o && o.p && Object.keys(o.p).length)){ save(); return; }
  S=upgrade(o); norm(); S.known=Object.keys(byId); added=[]; recovered=true; T=UI[S.lang||"fr"];
  save(); applyI18n(); banners(); render(); $("helpSheet").hidden=true; $("langSheet").hidden=!!S.lang ? true : false;
}); }
})();
</script>
